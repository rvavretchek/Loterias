{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Complete seu Cadastro - Gerador de Loterias{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-badge display-4 text-primary"></i>
                        <h3 class="mt-3">Falta pouco!</h3>
                        <p class="text-secondary">Informe seu nome e sobrenome pra concluir o cadastro.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Concluir Cadastro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
