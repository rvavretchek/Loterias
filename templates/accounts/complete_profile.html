{% extends 'base/base.html' %}
{% load lottiq_ui %}

{% block title %}Complete seu Cadastro - Lottiq{% endblock %}

{% block content %}
<div class="lq-auth">
    <div class="lq-container">
        <div class="lq-auth-card">
            <div class="lq-auth-head">
                <h1>Falta pouco</h1>
                <p>Informe seu nome e sobrenome pra concluir o cadastro.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {% lq_form form %}
                <button type="submit" class="lq-btn lq-btn-primary lq-btn-block" style="margin-top:4px;">Concluir cadastro</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
