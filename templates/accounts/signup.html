{% extends 'base/base.html' %}
{% load lottiq_ui %}

{% block title %}Cadastro - Lottiq{% endblock %}

{% block content %}
<div class="lq-auth">
    <div class="lq-container">
        <div class="lq-auth-card">
            <div class="lq-auth-head">
                <h1>Criar conta</h1>
                <p>Informe seu e-mail pra começar. Você define sua senha depois de confirmar.</p>
            </div>

            <form method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}
                {% lq_form form %}
                <button type="submit" class="lq-btn lq-btn-primary lq-btn-block" style="margin-top:4px;">Criar conta</button>
            </form>

            <div class="lq-auth-foot">
                Já tem uma conta? <a href="{% url 'account_login' %}">Entrar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
