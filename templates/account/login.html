{% extends 'base/base.html' %}
{% load lottiq_ui %}

{% block title %}Entrar - Lottiq{% endblock %}

{% block content %}
<div class="lq-auth">
    <div class="lq-container">
        <div class="lq-auth-card">
            <div class="lq-auth-head">
                <h1>Bom te ver de volta</h1>
                <p>Seus jogos e regras continuam onde você deixou.</p>
            </div>

            <form method="post" action="{% url 'account_login' %}">
                {% csrf_token %}
                {% lq_form form %}

                <div class="lq-row-between" style="margin-bottom:20px;">
                    <label class="lq-check" for="remember"><input class="lq-check-input" type="checkbox" name="remember" id="remember"><span>Lembrar-me</span></label>
                    <a href="{% url 'account_reset_password' %}" class="lq-small" style="font-weight:600;">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="lq-btn lq-btn-primary lq-btn-block">Entrar</button>
            </form>

            <div class="lq-auth-foot">
                Não tem conta? <a href="{% url 'account_signup' %}">Cadastre-se grátis</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
