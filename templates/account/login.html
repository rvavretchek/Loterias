{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Entrar - Gerador de Loterias{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right display-4 text-primary"></i>
                        <h3 class="mt-3">Bem-vindo de Volta</h3>
                        <p class="text-secondary">Entre com seu e-mail e senha</p>
                    </div>

                    <form method="post" action="{% url 'account_login' %}">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                                <label class="form-check-label" for="remember">Lembrar-me</label>
                            </div>
                            <a href="{% url 'account_reset_password' %}" class="text-primary small">Esqueceu a senha?</a>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="mb-0">Nao tem conta? 
                            <a href="{% url 'account_signup' %}" class="text-primary fw-semibold">Cadastre-se gratis</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
