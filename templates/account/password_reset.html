{% extends 'base/base.html' %}
{% load lottiq_ui %}

{% block title %}Recuperar Senha - Lottiq{% endblock %}

{% block content %}
<div class="lq-auth">
    <div class="lq-container">
        <div class="lq-auth-card">
            <div class="lq-auth-head">
                <h1>Recuperar senha</h1>
                <p>Informe seu e-mail para receber as instruções.</p>
            </div>

            <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                {% lq_form form %}
                <button type="submit" class="lq-btn lq-btn-primary lq-btn-block" style="margin-top:4px;">Enviar instruções</button>
            </form>

            <div class="lq-auth-foot">
                <a href="{% url 'account_login' %}">Voltar para o login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
