{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Recuperar Senha - Gerador de Loterias{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-key display-4 text-primary"></i>
                        <h3 class="mt-3">Recuperar Senha</h3>
                        <p class="text-secondary">Informe seu e-mail para receber instrucoes</p>
                    </div>

                    <form method="post" action="{% url 'account_reset_password' %}">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-send me-2"></i>Enviar Instrucoes
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <a href="{% url 'account_login' %}" class="text-primary">
                            <i class="bi bi-arrow-left me-1"></i>Voltar para login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
