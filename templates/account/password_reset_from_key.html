{% extends 'base/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Nova Senha - Gerador de Loterias{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock display-4 text-primary"></i>
                        <h3 class="mt-3">Definir nova senha</h3>
                        <p class="text-secondary">Informe sua nova senha abaixo.</p>
                    </div>
                    <form method="post" action="{{ action_url }}">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Salvar nova senha</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
