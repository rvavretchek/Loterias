{% block title %}E-mail Enviado - Lottiq{% endblock %}

{% block content %}

    <div class="lq-container">
        <div class="lq-auth-card">
            <div class="lq-auth-head">
                <span class="ms" aria-hidden="true">mark_email_read</span>

        </div>
    </div>
</div>
{% endblock %}
