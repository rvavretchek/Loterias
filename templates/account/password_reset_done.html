{% extends 'base/base.html' %}

{% block title %}E-mail Enviado - Gerador de Loterias{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4 p-md-5 text-center">
                    <i class="bi bi-envelope-check display-4 text-success"></i>
                    <h3 class="mt-3">Verifique seu e-mail</h3>
                    <p class="text-secondary">Enviamos instrucoes para redefinir sua senha. Verifique sua caixa de entrada.</p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary mt-3">Voltar para login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
