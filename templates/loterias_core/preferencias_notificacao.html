{% extends 'base/base.html' %}
{% load lottiq_ui %}

{% block title %}Preferências de aviso - Lottiq{% endblock %}

{% block content %}
<div class="lq-container" style="padding:28px 0 60px; max-width:520px;">
    <div style="margin-bottom:20px;">
        <h1 style="font:700 26px/1.25 var(--font-display); color:var(--lq-navy); margin:0;">Preferências de aviso</h1>
        <p class="lq-small" style="margin-top:4px;">Escolha como quer ser avisado quando um jogo seu bater com o resultado oficial</p>
    </div>

    <div class="lq-card">
        <form method="post">
            {% csrf_token %}
            {% lq_form form %}
            <button type="submit" class="lq-btn lq-btn-primary lq-btn-block" style="margin-top:4px;"><span class="ms" aria-hidden="true">check</span>Salvar preferência</button>
        </form>
    </div>
</div>
{% endblock %}
