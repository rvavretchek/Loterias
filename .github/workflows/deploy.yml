name: Deploy (Salt - ambiente espelhado)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      # 'compose_dir' aponta pro subdiretorio onde o docker-compose.yml do Loterias
      # realmente mora (deploy/lab/, nao a raiz do checkout) -- sem isso o onlyif do
      # state generico 'subir_{{project}}' e sempre falso e o docker compose nunca
      # roda (ver deploy/lab/README.md e memoria cron-env-propagation-bug/incidente
      # 2026-09-11). Corrigido no state Salt (/srv/salt/deploy/init.sls no master) em
      # 2026-09-16 para aceitar esse pillar; o --build ja foi adicionado no state
      # generico tambem, entao o rebuild real acontece aqui, sem contorno ad hoc.
      - name: Aplicar state Salt em todos os hosts
        run: |
          sudo salt '*' state.apply deploy pillar="{\"project_name\": \"${{ github.event.repository.name }}\", \"git_url\": \"${{ github.server_url }}/${{ github.repository }}.git\", \"git_branch\": \"${{ github.ref_name }}\", \"compose_dir\": \"/opt/integrit/apps/${{ github.event.repository.name }}/deploy/lab\"}"

      - name: Recarregar nginx-proxy (pega o IP novo do container recriado)
        run: |
          sudo salt 'ubt-host01' cmd.run 'docker exec nginx-proxy nginx -s reload'
