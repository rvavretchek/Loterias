name: loterias

services:
  loterias-web:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: loterias-web
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: loterias.settings
      DEBUG: "False"
      SECRET_KEY: ${LOTERIAS_SECRET_KEY}
      PASSWORD_PEPPER: ${LOTERIAS_PASSWORD_PEPPER}
      DATABASE_NAME: /app/data/db.sqlite3
      ALLOWED_HOSTS: loterias.internal,www.loterias.internal
      CSRF_TRUSTED_ORIGINS: http://loterias.internal,http://www.loterias.internal
      SECURE_SSL_REDIRECT: "False"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${BREVO_SMTP_PORT:-587}
      EMAIL_USE_TLS: ${BREVO_SMTP_USE_TLS:-True}
      EMAIL_HOST_USER: ${BREVO_SMTP_USER}
      EMAIL_HOST_PASSWORD: ${BREVO_SMTP_KEY}
      DEFAULT_FROM_EMAIL: ${BREVO_FROM_EMAIL}
      OPERATOR_ALERT_EMAIL: ${OPERATOR_ALERT_EMAIL:-}
    volumes:
      - loterias_data:/app/data
      - loterias_media:/app/media
    networks:
      - lab-network

  loterias-cron:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: loterias-cron
    restart: unless-stopped
    # createcachetable NAO roda aqui de proposito: rodar nos dois containers contra o mesmo
    # SQLite compartilhado (volume loterias_data) e uma corrida real (createcachetable faz
    # check-then-create nao atomico) -- o container de cron nunca usa o cache do rate limiter
    # de confirmacao de e-mail (isso so acontece em requisicoes web), entao so o Dockerfile
    # (loterias-web) precisa criar a tabela.
    # printenv > /etc/environment e necessario porque cron nao herda o ambiente do container
    # pro processo do job (so HOME/LOGNAME/PATH/SHELL/PWD por padrao) -- sem isso, os jobs
    # do CRONJOBS caiam no DATABASE_NAME default do Django (BASE_DIR/db.sqlite3, um arquivo
    # vazio sem schema) em vez do banco real em /app/data/db.sqlite3, falhando em silencio
    # todo dia sem nenhum log (achado em 2026-09-11, cron nunca tinha rodado com sucesso).
    command: sh -c "printenv > /etc/environment && python manage.py crontab remove; python manage.py crontab add && cron -f"
    environment:
      DJANGO_SETTINGS_MODULE: loterias.settings
      DEBUG: "False"
      SECRET_KEY: ${LOTERIAS_SECRET_KEY}
      PASSWORD_PEPPER: ${LOTERIAS_PASSWORD_PEPPER}
      DATABASE_NAME: /app/data/db.sqlite3
      ALLOWED_HOSTS: loterias.internal,www.loterias.internal
      CSRF_TRUSTED_ORIGINS: http://loterias.internal,http://www.loterias.internal
      SECURE_SSL_REDIRECT: "False"
      TZ: America/Sao_Paulo
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      EMAIL_PORT: ${BREVO_SMTP_PORT:-587}
      EMAIL_USE_TLS: ${BREVO_SMTP_USE_TLS:-True}
      EMAIL_HOST_USER: ${BREVO_SMTP_USER}
      EMAIL_HOST_PASSWORD: ${BREVO_SMTP_KEY}
      DEFAULT_FROM_EMAIL: ${BREVO_FROM_EMAIL}
      OPERATOR_ALERT_EMAIL: ${OPERATOR_ALERT_EMAIL:-}
    volumes:
      - loterias_data:/app/data
      - loterias_media:/app/media
    networks:
      - lab-network

volumes:
  loterias_data:
    name: loterias_data
  loterias_media:
    name: loterias_media

networks:
  lab-network:
    name: infra-lab_lab-network
    external: true